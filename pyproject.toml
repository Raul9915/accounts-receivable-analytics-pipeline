[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-pipeline"
version = "1.0.0"
description = "Accounts Receivable Analytics & ETL Pipeline (Medallion architecture with DuckDB and Parquet)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raul Mendoza Sotomayor" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter>=1.0", "sqlglot>=25"]
sqlserver = ["pyodbc>=5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
